name: 🚀 CI/CD & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: ⤵️ Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Check code formatting (gofmt)
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet -mod=vendor ./...

  test:
    name: ⤵️ Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Run tests with race detector & coverage
        run: |
          go test -mod=vendor -race -v -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: netconfig-coverage
          path: coverage.out

  build:
    name: ⤵️ Build Artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build cross-platform binaries
        run: make cross

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum netconfig-* > checksums.txt 2>/dev/null || shasum -a 256 netconfig-* > checksums.txt
          cat checksums.txt

      - name: Upload pre-built binaries
        uses: actions/upload-artifact@v4
        with:
          name: netconfig-binaries
          path: |
            bin/netconfig-*
            bin/checksums.txt

  release:
    name: 🚀 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build cross-platform binaries
        run: make cross

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum netconfig-* > checksums.txt 2>/dev/null || shasum -a 256 netconfig-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/netconfig-*
            bin/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
